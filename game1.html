<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Block Puzzle Neon · Deluxe 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;}
:root{--bg:#0f0f23;--panel:#1a1a3e;--empty:#16213e;--on:#e94560;--accent:#00fff2;--hint:#533483;--gold:#ffd700;--danger:#ff2e63;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#eaeaea;touch-action:none;transition:background .4s;}
#gameContainer{width:100%;max-width:500px;height:100%;margin:0 auto;position:relative;display:flex;flex-direction:column;}
.screen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .3s,visibility .3s;padding:20px;overflow-y:auto;overflow-x:hidden;}
.screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
#menuScreen{background:linear-gradient(135deg,var(--bg) 0%,var(--panel) 100%);}
#gameScreen{background:var(--bg);justify-content:flex-start;padding-top:10px;}
h1{font-size:36px;font-weight:900;text-align:center;margin-bottom:10px;background:linear-gradient(135deg,var(--accent) 0%,var(--on) 50%,var(--gold) 100%);background-clip:text;color:transparent;animation:titleGlow 3s ease-in-out infinite;}
@keyframes titleGlow{0%,100%{filter:drop-shadow(0 0 10px var(--accent));}50%{filter:drop-shadow(0 0 20px var(--on));}}
.subtitle{font-size:14px;color:#888;text-align:center;margin-bottom:30px;}
.stats-row{display:flex;gap:20px;margin-bottom:20px;font-size:14px;color:#aaa;}
.stats-row span{background:rgba(255,255,255,.05);padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,.1);}
.menu-btn{width:220px;padding:14px;margin:8px 0;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:1px;}
.menu-btn.primary{background:linear-gradient(135deg,var(--accent),#00d4ff);color:#0f0f23;box-shadow:0 4px 15px rgba(0,255,242,.3);}
.menu-btn.secondary{background:linear-gradient(135deg,var(--on),#cc00cc);color:#fff;box-shadow:0 4px 15px rgba(255,0,255,.25);}
.menu-btn.tertiary{background:linear-gradient(135deg,var(--gold),#ffed4e);color:#0f0f23;box-shadow:0 4px 15px rgba(255,215,0,.3);}
.menu-btn:active{transform:scale(.95);}
#hud{width:100%;display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:var(--panel);border-radius:12px;margin-bottom:10px;}
.score-box{display:flex;flex-direction:column;align-items:center;}
.score-label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:1px;}
.score-value{font-size:24px;font-weight:900;color:var(--accent);text-shadow:0 0 10px var(--accent);}
.mode-badge{background:rgba(255,255,255,.08);color:var(--accent);padding:6px 12px;border-radius:8px;font-size:12px;font-weight:700;text-transform:uppercase;}
#pauseBtn{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px;cursor:pointer;transition:all .2s;}
#pauseBtn:active{background:rgba(255,255,255,.2);transform:scale(.9);}
#board{display:grid;gap:3px;padding:10px;background:var(--panel);border-radius:12px;margin:0 auto;}
.cell{background:var(--empty);border-radius:4px;aspect-ratio:1;transition:background .2s;position:relative;}
.cell.filled{box-shadow:inset 0 2px 8px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.3);}
.cell.filled::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);border-radius:4px 4px 0 0;}
.cell.filled::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;background:linear-gradient(0deg,rgba(0,0,0,.3),transparent);border-radius:0 0 4px 4px;}
.cell.hint{background:var(--hint);box-shadow:0 0 10px var(--accent);}
.cell.dropping{animation:drop .3s ease-out;}
@keyframes drop{0%{transform:scale(0);opacity:0;}50%{transform:scale(1.2);}100%{transform:scale(1);opacity:1;}}
.cell.clearing{animation:clear .4s ease-out forwards;}
@keyframes clear{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);box-shadow:0 0 20px currentColor;}100%{transform:scale(0);opacity:0;}}
.c1{background:linear-gradient(180deg,#ff9aa2,#e94560 50%,#b8264a);}
.c2{background:linear-gradient(180deg,#ffe29a,#ffb454 50%,#d98a1f);}
.c3{background:linear-gradient(180deg,#b8f2b0,#58c94a 50%,#2f9e33);}
.c4{background:linear-gradient(180deg,#9adcf2,#2ea8d8 50%,#1878a8);}
.c5{background:linear-gradient(180deg,#d3b8f2,#9a5fd8 50%,#7038a8);}
.c6{background:linear-gradient(180deg,#ffc4e3,#ff6bb8 50%,#d83a92);}
#tray{display:flex;justify-content:center;align-items:center;gap:18px;padding:14px;background:var(--panel);border-radius:12px;margin-top:15px;min-height:96px;}
.piece{display:grid;gap:2px;cursor:grab;touch-action:none;transition:all .2s;opacity:.95;filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));}
.piece:active{cursor:grabbing;opacity:1;transform:scale(1.05);}
.piece.used{opacity:.3;pointer-events:none;}
.piece-cell{border-radius:3px;position:relative;}
.piece-cell::before{content:'';position:absolute;top:0;left:0;right:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);border-radius:3px 3px 0 0;}
.piece-cell.off{visibility:hidden;}
#powerups{display:flex;justify-content:center;gap:10px;padding:10px;margin-top:10px;flex-wrap:wrap;}
.pbtn{position:relative;width:50px;height:50px;border:none;border-radius:12px;background:rgba(255,255,255,.1);color:#fff;font-size:24px;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;}
.pbtn:active:not(:disabled){transform:scale(.9);background:rgba(255,255,255,.2);}
.pbtn .cost{position:absolute;bottom:-5px;right:-5px;background:var(--gold);color:#0f0f23;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.pbtn:disabled{opacity:.4;cursor:not-allowed;}
.pbtn.deny{animation:dangerShake .3s;border-color:var(--danger);}
.pbtn.free::after{content:'FREE';position:absolute;top:-8px;right:-8px;background:#10b981;color:#fff;font-size:8px;font-weight:700;padding:2px 5px;border-radius:6px;box-shadow:0 2px 5px rgba(0,0,0,.3);}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px);}
.overlay.hidden{display:none;}
.overlay-content{background:linear-gradient(135deg,var(--panel),var(--bg));border:2px solid var(--accent);border-radius:20px;padding:30px;max-width:400px;width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,255,242,.2);max-height:90vh;overflow-y:auto;}
.overlay-content h2{font-size:32px;margin-bottom:20px;color:var(--accent);text-shadow:0 0 15px var(--accent);}
.final-score{font-size:48px;font-weight:900;color:var(--gold);margin:20px 0;text-shadow:0 0 20px rgba(255,215,0,.5);}
.new-record{font-size:20px;color:var(--on);font-weight:700;animation:pulse 1s ease-in-out infinite;margin:10px 0;}
.new-record.hidden{display:none;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
.stars{display:flex;justify-content:center;gap:10px;margin:20px 0;font-size:36px;}
.star{opacity:.3;transition:all .3s;}
.star.active{opacity:1;animation:starPop .5s ease-out;}
@keyframes starPop{0%{transform:scale(0);}50%{transform:scale(1.3);}100%{transform:scale(1);}}
.overlay-btn{width:100%;padding:12px;margin:8px 0;border:none;border-radius:10px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;text-transform:uppercase;}
.overlay-btn:active{transform:scale(.95);}
.btn-primary{background:linear-gradient(135deg,var(--accent),#00d4ff);color:#0f0f23;}
.btn-secondary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;}
.btn-share{background:linear-gradient(135deg,#10b981,#059669);color:#fff;font-size:18px;padding:15px;box-shadow:0 4px 15px rgba(16,185,129,.3);}
.btn-share.hidden{display:none;}
.btn-watch{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;}
.btn-watch.hidden{display:none;}
.coins-earned{display:flex;justify-content:center;gap:8px;align-items:center;font-size:14px;color:var(--gold);margin:8px 0;padding:6px 14px;background:rgba(255,215,0,.1);border-radius:10px;border:1px solid rgba(255,215,0,.2);}
.coins-earned .bonus{color:#ff6b6b;font-weight:800;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--panel);color:#fff;padding:12px 24px;border-radius:25px;font-size:14px;font-weight:600;border:2px solid var(--accent);box-shadow:0 5px 20px rgba(0,0,0,.5);z-index:2000;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:90%;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.error{border-color:var(--danger);box-shadow:0 5px 20px rgba(255,71,87,.3);}
#toast.success{border-color:#2ed573;box-shadow:0 5px 20px rgba(46,213,115,.3);}
.particle{position:fixed;width:8px;height:8px;border-radius:50%;pointer-events:none;z-index:1500;}
.trail{position:fixed;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:1400;opacity:.7;}
.confetti{position:fixed;width:10px;height:10px;pointer-events:none;z-index:1600;}
.floating-text{position:fixed;font-size:24px;font-weight:900;pointer-events:none;z-index:1700;text-shadow:0 0 10px currentColor;animation:floatUp 1.5s ease-out forwards;}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1);}100%{opacity:0;transform:translateY(-80px) scale(1.5);}}
#timerBar{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:200px;height:6px;background:rgba(0,0,0,.5);border-radius:3px;overflow:hidden;opacity:0;transition:opacity .3s;z-index:1800;}
#timerBar.active{opacity:1;}
#timerFill{height:100%;background:linear-gradient(90deg,var(--on),#cc00ff);width:100%;transform-origin:left;box-shadow:0 0 10px var(--on);}
body.fever{animation:feverPulse 1s ease-in-out infinite;}
@keyframes feverPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.2) saturate(1.3);}}
body.danger #board{animation:dangerShake .5s ease-in-out infinite;}
@keyframes dangerShake{0%,100%{transform:translateX(0);}25%{transform:translateX(-2px);}75%{transform:translateX(2px);}}
.big-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:48px;font-weight:900;pointer-events:none;z-index:1900;text-shadow:0 0 20px currentColor;opacity:0;}
.big-toast.show{animation:bigToastPop 1.5s ease-out forwards;}
@keyframes bigToastPop{0%{transform:translate(-50%,-50%) scale(0);opacity:0;}30%{transform:translate(-50%,-50%) scale(1.3);opacity:1;}60%{transform:translate(-50%,-50%) scale(1);opacity:1;}100%{transform:translate(-50%,-50%) scale(1);opacity:0;}}
.settings-group{background:rgba(255,255,255,.05);border-radius:12px;padding:15px;margin:10px 0;width:100%;max-width:400px;}
.settings-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);}
.settings-row:last-child{border-bottom:none;}
.toggle-btn{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;min-width:80px;}
.toggle-btn.active{background:linear-gradient(135deg,var(--accent),#00d4ff);color:#0f0f23;border-color:var(--accent);}
.swatch-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px;justify-items:center;}
.swatch{width:40px;height:40px;border-radius:8px;cursor:pointer;border:3px solid transparent;transition:all .2s;}
.swatch:active{transform:scale(.9);}
.swatch.selected{border-color:#fff;box-shadow:0 0 15px rgba(255,255,255,.5);}
.coins-display{display:flex;align-items:center;gap:8px;background:rgba(255,215,0,.2);padding:8px 16px;border-radius:20px;border:1px solid rgba(255,215,0,.3);}
.coins-display span{font-size:18px;font-weight:900;color:var(--gold);}
#levelProgress{width:92%;max-width:320px;height:5px;background:rgba(255,255,255,.06);border-radius:3px;margin:3px auto;overflow:hidden;}
#levelFill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transform-origin:left;transform:scaleX(0);}
#statusBadge{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:3px 10px;border-radius:10px;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;z-index:3000;opacity:.75;pointer-events:none;}
#statusBadge.online{background:rgba(16,185,129,.2);color:#10b981;border:1px solid rgba(16,185,129,.4);}
#statusBadge.offline{background:rgba(239,68,68,.15);color:#ef4444;border:1px solid rgba(239,68,68,.3);}
#leagueBadge{position:absolute;top:20px;right:20px;background:rgba(255,255,255,.1);padding:6px 14px;border-radius:20px;font-size:14px;font-weight:700;border:1px solid rgba(255,255,255,.2);}
@media(max-width:500px){h1{font-size:28px;}.menu-btn{width:180px;padding:12px;font-size:14px;}.score-value{font-size:20px;}}
</style>
</head>
<body>
<div id="statusBadge">OFFLINE</div>
<div id="gameContainer">
<div id="leagueBadge">🥉 Bronce</div>
<div id="menuScreen" class="screen">
<h1>BLOCK PUZZLE<br>DELUXE 3D</h1>
<p class="subtitle" data-i18n="subtitle"></p>
<div class="stats-row">
<span>🏆 <span id="bestScore">0</span></span>
<span>🔥 <span id="streak">0</span></span>
</div>
<div class="coins-display" style="margin-bottom:20px;">
<span>🪙</span>
<span id="menuCoins">0</span>
</div>
<button class="menu-btn primary" data-i18n="classic" onclick="startGame('classic')"></button>
<button class="menu-btn secondary" data-i18n="blitz" onclick="startGame('blitz')"></button>
<button class="menu-btn tertiary" data-i18n="levels" onclick="startGame('level')"></button>
<button class="menu-btn secondary" data-i18n="missions" onclick="showScreen('missionsScreen')"></button>
<button class="menu-btn secondary" data-i18n="shop" onclick="showScreen('shopScreen')"></button>
<button class="menu-btn secondary" data-i18n="stats" onclick="showScreen('statsScreen')"></button>
<button class="menu-btn secondary" data-i18n="daily" onclick="showScreen('dailyScreen')"></button>
<button class="menu-btn secondary" data-i18n="settings" onclick="showScreen('settingsScreen')"></button>
</div>

<div id="gameScreen" class="screen hidden">
<div id="hud">
<div class="score-box">
<div class="score-label" data-i18n="points"></div>
<div class="score-value" id="score">0</div>
</div>
<div class="score-box" id="targetBox" style="display:none;">
<div class="score-label" data-i18n="target"></div>
<div class="score-value" id="targetScore">0</div>
</div>
<div class="mode-badge" id="modeBadge">CLÁSICO</div>
<button id="pauseBtn" onclick="togglePause()">⏸</button>
</div>
<div id="levelProgress" style="display:none;"><div id="levelFill"></div></div>
<div id="timerBar"><div id="timerFill"></div></div>
<div id="board"></div>
<div id="tray"></div>
<div id="powerups">
<button class="pbtn" id="pUndo" onclick="usePower('undo')">↩️<span class="cost">75</span></button>
<button class="pbtn" id="pHammer" onclick="usePower('hammer')">🔨<span class="cost">100</span></button>
<button class="pbtn" id="pBomb" onclick="usePower('bomb')">💣<span class="cost">50</span></button>
<button class="pbtn" id="pRowCol" onclick="usePower('rowcol')">➖<span class="cost">150</span></button>
<button class="pbtn" id="pHint" onclick="usePower('hint')">💡<span class="cost">20</span></button>
<button class="pbtn" id="pShuffle" onclick="usePower('shuffle')">🔀<span class="cost">40</span></button>
<button class="pbtn" id="pFreeze" onclick="usePower('freeze')" style="display:none;">❄️<span class="cost">60</span></button>
</div>
</div>

<div id="missionsScreen" class="screen hidden">
<h2 style="color:var(--accent);margin-bottom:20px;" data-i18n="mTitle"></h2>
<div id="missionsList" style="width:100%;max-width:400px;"></div>
<button class="menu-btn secondary" data-i18n="back" onclick="showScreen('menuScreen')" style="margin-top:20px;"></button>
</div>

<div id="shopScreen" class="screen hidden">
<h2 style="color:var(--accent);margin-bottom:20px;" data-i18n="sTitle"></h2>
<div class="coins-display" style="margin-bottom:20px;"><span>🪙</span><span id="shopCoins">0</span></div>
<div id="shopList" style="width:100%;max-width:400px;"></div>
<button class="menu-btn secondary" data-i18n="back" onclick="showScreen('menuScreen')" style="margin-top:20px;"></button>
</div>

<div id="statsScreen" class="screen hidden">
<h2 style="color:var(--accent);margin-bottom:20px;" data-i18n="stTitle"></h2>
<div id="statsList" style="width:100%;max-width:400px;background:rgba(255,255,255,.05);border-radius:12px;padding:20px;"></div>
<button class="menu-btn secondary" data-i18n="back" onclick="showScreen('menuScreen')" style="margin-top:20px;"></button>
</div>

<div id="dailyScreen" class="screen hidden">
<h2 style="color:var(--accent);margin-bottom:20px;" data-i18n="dTitle"></h2>
<div id="dailyGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:10px;max-width:400px;"></div>
<button class="menu-btn secondary" data-i18n="back" onclick="showScreen('menuScreen')" style="margin-top:20px;"></button>
</div>

<div id="settingsScreen" class="screen hidden">
<h2 style="color:var(--accent);margin-bottom:20px;" data-i18n="setTitle"></h2>
<div class="settings-group">
<div class="settings-row"><span data-i18n="sound"></span><button class="toggle-btn active" id="soundToggle" onclick="toggleSound()">ON</button></div>
<div class="settings-row"><span data-i18n="music"></span><button class="toggle-btn active" id="musicToggle" onclick="toggleMusic()">ON</button></div>
<div class="settings-row"><span data-i18n="vib"></span><button class="toggle-btn active" id="vibToggle" onclick="toggleVib()">ON</button></div>
<div class="settings-row"><span data-i18n="lang"></span><button class="toggle-btn" id="langToggle" onclick="toggleLang()">ES</button></div>
</div>
<div class="settings-group">
<div style="margin-bottom:10px;font-weight:700;" data-i18n="theme"></div>
<div class="swatch-grid" id="swRow"></div>
</div>
<button class="menu-btn secondary" data-i18n="back" onclick="showScreen('menuScreen')" style="margin-top:20px;"></button>
</div>

<div id="pauseOverlay" class="overlay hidden">
<div class="overlay-content">
<h2 data-i18n="pauseTitle"></h2>
<button class="overlay-btn btn-primary" data-i18n="resume" onclick="togglePause()"></button>
<button class="overlay-btn btn-secondary" data-i18n="restart" onclick="restartGame()"></button>
<button class="overlay-btn btn-secondary" data-i18n="menu" onclick="backToMenu()"></button>
</div>
</div>

<div id="overOverlay" class="overlay hidden">
<div class="overlay-content">
<h2 id="overTitle"></h2>
<div class="final-score" id="finalScore">0</div>
<div class="new-record hidden" id="newRecord">🏆 ¡NUEVO RÉCORD!</div>
<p id="overMessage"></p>
<div class="coins-earned hidden" id="coinsEarned"></div>
<button class="overlay-btn btn-share hidden" id="btnShare" onclick="shareScore()"></button>
<button class="overlay-btn btn-watch hidden" id="btnWatchAd" onclick="watchAd()"></button>
<button class="overlay-btn btn-primary" data-i18n="retry" onclick="restartGame()"></button>
<button class="overlay-btn btn-secondary" data-i18n="menu" onclick="backToMenu()"></button>
</div>
</div>

<div id="levelOverlay" class="overlay hidden">
<div class="overlay-content">
<h2 style="color:var(--gold);" data-i18n="levelDoneTitle"></h2>
<div class="final-score" id="levelScore">0</div>
<div class="stars" id="levelStars"><span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span></div>
<p id="levelReward"></p>
<button class="overlay-btn btn-primary" data-i18n="next" onclick="nextLevel()"></button>
<button class="overlay-btn btn-secondary" data-i18n="menu" onclick="backToMenu()"></button>
</div>
</div>

<div id="boosterOverlay" class="overlay hidden">
<div class="overlay-content">
<h2 data-i18n="boosterTitle"></h2>
<p style="color:#888;margin-bottom:20px;" data-i18n="boosterDesc"></p>
<div style="display:flex;justify-content:center;gap:20px;">
<div onclick="selectBooster('hammer')" style="cursor:pointer;padding:15px;background:rgba(255,255,255,.05);border-radius:12px;text-align:center;">
<div style="font-size:48px;">🔨</div>
<div style="margin-top:10px;font-weight:700;">MARTILLO</div>
</div>
<div onclick="selectBooster('bomb')" style="cursor:pointer;padding:15px;background:rgba(255,255,255,.05);border-radius:12px;text-align:center;">
<div style="font-size:48px;">💣</div>
<div style="margin-top:10px;font-weight:700;">BOMBA</div>
</div>
<div onclick="selectBooster('rowcol')" style="cursor:pointer;padding:15px;background:rgba(255,255,255,.05);border-radius:12px;text-align:center;">
<div style="font-size:48px;">➖</div>
<div style="margin-top:10px;font-weight:700;">FIL/COL</div>
</div>
</div>
<button class="overlay-btn btn-secondary" data-i18n="skipB" onclick="skipBooster()" style="margin-top:15px;"></button>
</div>
</div>

 const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,tt);
 if(s)o.frequency.exponentialRampToValueAtTime(s,tt+d);
 g.gain.setValueAtTime(v||.2,tt);g.gain.exponentialRampToValueAtTime(.001,tt+d);
 o.connect(g);g.connect(AC.destination);o.start(tt);o.stop(tt+d+.02);}catch(e){}}

function refill(){

  const crowded = emptyCells <= 24;
  const small = SHAPES.slice(0, 4);
  const big = SHAPES.slice(4);
  
  const selected = [];
  const selectedColors = [];
  const usedPairs = new Set();
  
  for(let i=0; i<3; i++){
    let shape, color, isDuplicate, attempts = 0;
    do {
      let pSmall = crowded ? 0.75 : (score > 5000 ? 0.40 : 0.50);
      const useSmall = Math.random() < pSmall;
      const pool = useSmall ? small : big;
      shape = pool[Math.floor(Math.random() * pool.length)];
      color = randColor();
      isDuplicate = usedPairs.has(JSON.stringify(shape) + '-' + color);
      attempts++;
      if (attempts >= 10) {
        isDuplicate = false;
      }
    } while(isDuplicate && attempts < 10);
    
    selected.push(shape);
    selectedColors.push(color);
    usedPairs.add(JSON.stringify(shape) + '-' + color);
  }
  
  pieces = selected;
  pcols = selectedColors;
  used = [false, false, false];
  renderTray();
}

function layout(){
 const availW=Math.min(window.innerWidth-24,480);
 const availH=Math.max(280,window.innerHeight-320);
 const bw=Math.max(280,Math.min(availW,availH,480));
 const inner=bw-20-21;
 cell=Math.floor(inner/N);
 board.style.width=bw+'px';
 board.style.gridTemplateColumns=`repeat(${N},${cell}px)`;
 board.innerHTML='';
 for(let i=0;i<N*N;i++){const c=document.createElement('div');c.className='cell';
  c.addEventListener('click',()=>cellTap(i));board.appendChild(c);}}
function render(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const i=r*N+c,v=grid[r][c];
  board.children[i].className='cell'+(v?' filled c'+v:'')+(popped.includes(i)?' clearing':'')+(dropped.includes(i)?' dropping':'');}
 let z=0;grid.forEach(row=>row.forEach(v=>{if(!v)z++;}));
 document.body.classList.toggle('danger',z<=14);
 if(z<=14&&!wasDanger){wasDanger=true;sDanger();vib(40);}
 if(z>14)wasDanger=false;}
function renderTray(){tray.innerHTML='';const mini=Math.max(18,Math.floor(cell*.55));
 pieces.forEach((shape,idx)=>{const p=document.createElement('div');
  p.className='piece'+(used[idx]?' used':'');
  p.style.gridTemplateColumns=`repeat(${shape[0].length},${mini}px)`;
  shape.forEach(row=>row.forEach(v=>{const d=document.createElement('div');
   d.className='piece-cell'+(v?' c'+pcols[idx]:' off');
   d.style.width=mini+'px';d.style.height=mini+'px';p.appendChild(d);}));
  p.addEventListener('pointerdown',e=>startDrag(e,idx));tray.appendChild(p);});}
function startDrag(e,idx){if(used[idx]||!gameActive||paused||hammerMode||bombMode||rowcolMode)return;e.preventDefault();
 const shape=pieces[idx],g=document.createElement('div');
 g.style.cssText='position:fixed;z-index:50;pointer-events:none;opacity:.9;display:grid;gap:3px;filter:drop-shadow(0 0 14px var(--accent));';
 g.style.gridTemplateColumns=`repeat(${shape[0].length},${cell}px)`;
 shape.forEach(row=>row.forEach(v=>{const d=document.createElement('div');
  d.className='piece-cell'+(v?' c'+pcols[idx]:' off');
  d.style.width=cell+'px';d.style.height=cell+'px';g.appendChild(d);}));
 document.body.appendChild(g);drag={idx,g,w:shape[0].length*cell,h:shape.length*cell};
 moveDrag(e);document.addEventListener('pointermove',moveDrag);document.addEventListener('pointerup',endDrag);}
function moveDrag(e){if(!drag)return;const gx=e.clientX-drag.w/2,gy=e.clientY-drag.h-50;
 drag.g.style.left=gx+'px';drag.g.style.top=gy+'px';
 const now=Date.now();if(now-lastTrail>50){lastTrail=now;trail(gx+drag.w/2,gy+drag.h/2);}
 clearHints();
 const t=targetAt(gx,gy);if(t&&canPlace(drag.idx,t.r,t.c))paintHints(drag.idx,t.r,t.c);}
function targetAt(gx,gy){const br=board.getBoundingClientRect(),st=cell+3;
 const c=Math.round((gx-br.left-10)/st),r=Math.round((gy-br.top-10)/st);
 return(r>=0&&r<N&&c>=0&&c<N)?{r,c}:null;}
function endDrag(e){document.removeEventListener('pointermove',moveDrag);document.removeEventListener('pointerup',endDrag);
 if(!drag)return;const gx=parseFloat(drag.g.style.left),gy=parseFloat(drag.g.style.top);
 const t=targetAt(gx,gy),idx=drag.idx;drag.g.remove();drag=null;clearHints();
 if(t&&canPlace(idx,t.r,t.c))placePiece(idx,t.r,t.c);}

function placePiece(idx,r,c){
 snap={grid:grid.map(x=>x.slice()),used:used.slice(),score,combo};
 dropped=[];popped=[];
 const s=pieces[idx];let count=0;
 const mult=feverMult();
 for(let i=0;i<s.length;i++)for(let j=0;j<s[0].length;j++)if(s[i][j]){grid[r+i][c+j]=pcols[idx];dropped.push((r+i)*N+(c+j));count++;}
 score+=count*mult;used[idx]=true;renderTray();
 
 vib(15);
 
 const n=clearLines();
 if(n>0){combo++;meta.maxCombo=Math.max(meta.maxCombo,combo);meta.lines+=n;
  meta.today.maxCombo=Math.max(meta.today.maxCombo||0,combo);meta.today.lines=(meta.today.lines||0)+n;
  const pts=n*10*n*combo*mult,cg=n*2*combo;score+=pts;meta.coins+=cg;
  sClear(n);
  if(combo>1){sCombo(combo);showBigToast('COMBO x'+combo+'!','combo');}
  
  if (n === 1) vib(40);
  else if (n === 2) vib(60);
  else vib([60, 40, 60]);
  
  if(n>=2)shake();
  
  if(combo>=3) triggerFever();
  
  popped.forEach(i=>particles(i));
  const br=board.getBoundingClientRect();
  floatText('+'+Math.floor(pts),br.left+br.width/2,br.top+br.height/2,false);
  floatText('+'+cg+'🪙',br.left+br.width/2,br.top+br.height/2+34,false);
  if(mode==='level')$('levelFill').style.transform=`scaleX(${Math.min(1,score/target)})`;
 }else{combo=0;sPlace();}
 const ms=Math.floor(score/1000);
 if(ms>lastMilestone){lastMilestone=ms;toast('🎉 '+ms*1000+'!','success');sWin();confetti(25);}
 hud();render();
 let full=0;grid.forEach(row=>row.forEach(v=>{if(v)full++;}));
 if(full===0&&n>0){
  score+=500;meta.today.perfects=(meta.today.perfects||0)+1;
  const br2=board.getBoundingClientRect();
  floatText(T('perfect'),br2.left+br2.width/2,br2.top+br2.height/2-80,true);
  confetti();sPerfect();vib([100,50,100,50,200]);hud();
 }
 
 if (used.every(u => u)) {
   refill();
   if (!trayEmptyBonusClaimed) {
     meta.coins += 3;
     trayEmptyBonusClaimed = true;
     sCoin();
     toast(T('plus5'), 'success');
   }
 }
 
 saveMeta();
 checkAch();ensureMissions();
 if(mode==='level'&&score>=target&&!levelDone){levelComplete();return;}
 checkOver();
}
function canPlace(idx,r,c){const s=pieces[idx];
 for(let i=0;i<s.length;i++)for(let j=0;j<s[0].length;j++){if(!s[i][j])continue;
  const R=r+i,C=c+j;if(R<0||C<0||R>=N||C>=N||grid[R][C])return false;}return true;}
function paintHints(idx,r,c){const s=pieces[idx];hints=[];
 for(let i=0;i<s.length;i++)for(let j=0;j<s[0].length;j++)
  if(s[i][j]&&r+i>=0&&r+i<N&&c+j>=0&&c+j<N){board.children[(r+i)*N+(c+j)].classList.add('hint');hints.push((r+i)*N+(c+j));}}
function clearHints(){hints.forEach(i=>board.children[i]&&board.children[i].classList.remove('hint'));hints=[];}
function clearLines(){popped=[];const rows=[],cols=[];
 for(let r=0;r<N;r++)if(grid[r].every(v=>v))rows.push(r);
 for(let c=0;c<N;c++)if(grid.every(row=>row[c]))cols.push(c);
 const n=rows.length+cols.length;if(!n)return 0;
 rows.forEach(r=>{for(let c=0;c<N;c++)popped.push(r*N+c);grid[r].fill(0);});
 cols.forEach(c=>{for(let r=0;r<N;r++){const i=r*N+c;if(!popped.includes(i))popped.push(i);grid[r][c]=0;}});
 return n;}
function checkOver(){for(let i=0;i<3;i++){if(used[i])continue;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(canPlace(i,r,c))return;}
 gameOver();}

function cellTap(i){const r=Math.floor(i/N),c=i%N;
 if(hammerMode&&grid[r][c]){grid[r][c]=0;particles(i);render();
  hammerOff();freeBooster=null;updatePowerAvailability();sClear(1);vib(30);saveMeta();checkOver();return;}
 if(bombMode){popped=[];for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
   const R=r+a,C=c+b;if(R>=0&&R<N&&C>=0&&C<N&&grid[R][C]){grid[R][C]=0;popped.push(R*N+C);}}
  popped.forEach(x=>particles(x));shake();sClear(2);vib(60);
  bombOff();freeBooster=null;updatePowerAvailability();render();saveMeta();checkOver();return;}
 if(rowcolMode){for(let k=0;k<N;k++){if(grid[r][k])grid[r][k]=0;if(grid[k][c])grid[k][c]=0;}
  shake();sClear(3);vib(80);

function toggleVib(){meta.vib=!meta.vib;applyLang();saveMeta();}
function toggleLang(){meta.lang=meta.lang==='es'?'en':'es';applyLang();saveMeta();}

function buildSw(){const row=$('swRow');row.innerHTML='';
 SKINS.forEach(s=>{const d=document.createElement('div');d.className='swatch'+(meta.skin===s.id?' selected':'');
  d.style.background=s.c.on;
  d.onclick=()=>{if(meta.owned.includes(s.id)){applySkin(s.id);saveMeta();}else showScreen('shopScreen');};
  row.appendChild(d);});}

window.__grantReward=function(tipo){
 cancelAdTimeout();
 if(tipo==="continue") doContinue();
 else if(tipo==="martillo"){
  bombOff(); rowcolOff(); hammerMode=true; document.body.classList.add('hammer');
  const br=board.getBoundingClientRect(); floatText(T('tapBlock'), br.left+br.width/2, br.top+br.height/2, true);
 }
 else if(tipo==="bomba"){
  hammerOff(); rowcolOff(); bombMode=true; document.body.classList.add('bomb');
  const br=board.getBoundingClientRect(); floatText(T('tapBomb'), br.left+br.width/2, br.top+br.height/2, true);
 }
 else if(tipo==="rowcol"){
  hammerOff(); bombOff(); rowcolMode=true; document.body.classList.add('rowcol');
  const br=board.getBoundingClientRect(); floatText(T('tapRowCol'), br.left+br.width/2, br.top+br.height/2, true);
 }
 else if(tipo==="share"){ meta.coins+=50; saveMeta(true); toast("🎁 +50🪙",'success'); updateMenu(); }
 if(pendingRewardBtn){ pendingRewardBtn.disabled=false; pendingRewardBtn=null; }
 toast(T('rewardGot'),'success');
};
window.__denyReward=function(tipo){
 cancelAdTimeout();
 toast(T('denyAd'),'error');
 if(pendingRewardBtn){pendingRewardBtn.disabled=false;pendingRewardBtn=null;}
};
window.__rewardError=function(tipo){
 cancelAdTimeout();
 toast('❌ '+T('adError'),'error');
 if(pendingRewardBtn){pendingRewardBtn.disabled=false;pendingRewardBtn=null;}
};

function triggerFever(){
 feverEnd=(Date.now()>=feverEnd)?Date.now()+6000:Math.min(feverEnd+2000,Date.now()+10000);
 document.body.classList.add('fever');
 meta.today.fever=(meta.today.fever||0)+1;
 sFever();vib([60,40,60]);showBigToast('🔥 FEVER x2','fever');
 setTimeout(()=>{if(Date.now()>=feverEnd)document.body.classList.remove('fever');},Math.max(0,feverEnd-Date.now()));
 checkAch();
}
function feverMult(){return Date.now()<feverEnd?2:1;}

function particles(i){if(!board.children[i])return;
 const r=board.children[i].getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 for(let k=0;k<7;k++){const p=document.createElement('div');p.className='particle';
  p.style.left=cx+'px';p.style.top=cy+'px';
  p.style.background=PCOL[Math.floor(Math.random()*NCOLORS)];p.style.boxShadow='0 0 8px '+p.style.background;
  document.body.appendChild(p);const a=Math.random()*Math.PI*2,d=30+Math.random()*75;
  p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(0)`,opacity:0}],{duration:500+Math.random()*300,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove();}}
function trail(x,y){trailCount++;if(trailCount>20)return;
 const p=document.createElement('div');p.className='trail';p.style.left=x+'px';p.style.top=y+'px';
 p.style.background=PCOL[Math.floor(Math.random()*NCOLORS)];document.body.appendChild(p);
 p.animate([{transform:'scale(1)',opacity:.7},{transform:'scale(0)',opacity:0}],{duration:300,easing:'ease-out'}).onfinish=()=>{p.remove();trailCount--;};}
function confetti(n){n=n||60;for(let k=0;k<n;k++){
 const c=document.createElement('div');c.className='confetti';c.style.left=(Math.random()*100)+'%';c.style.top='-20px';
 c.style.background=PCOL[Math.floor(Math.random()*NCOLORS)];c.style.borderRadius=Math.random()<.5?'50%':'2px';
 document.body.appendChild(c);
 c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${window.innerHeight+40}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:2000+Math.random()*1500,easing:'cubic-bezier(.3,.8,.5,1)'}).onfinish=()=>c.remove();}}
function floatText(txt,x,y,big){const d=document.createElement('div');d.className='floating-text';if(big)d.style.fontSize='32px';
 d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';d.style.color=big?'var(--gold)':'var(--accent)';document.body.appendChild(d);
 d.animate([{transform:'translateY(0) scale(.8)',opacity:0},{transform:'translateY(-35px) scale(1.1)',opacity:1,offset:.25},{transform:'translateY(-95px) scale(1)',opacity:0}],{duration:1500,easing:'ease-out'}).onfinish=()=>d.remove();}
function shake(){board.style.animation='none';void board.offsetWidth;board.style.animation='dangerShake .3s';}
function hud(){const from=displayed,to=score,t0=performance.now();cancelAnimationFrame(hudRAF);
 const step=t=>{const k=Math.min(1,(t-t0)/350);displayed=Math.round(from+(to-from)*k);
 $('score').textContent=displayed;if(k<1)hudRAF=requestAnimationFrame(step);};hudRAF=requestAnimationFrame(step);}

function updateLeague(){
 let cur=LEAGUES[0];
 LEAGUES.forEach(l=>{if(meta.best>=l.min)cur=l;});
 const badge=document.getElementById('leagueBadge');
 if(badge){badge.textContent=cur[meta.lang];}
}

window.addEventListener('resize',()=>{if(gameActive){layout();render();renderTray();}});
document.addEventListener('pointerdown',()=>{if(meta.music)musicStart();},{once:true});
applySkin(meta.skin);
applyLang();
ensureMissions();
updateMenu();
buildSw();
updateStatusBadge();
showScreen('menuScreen');
bridge('ready/'+meta.best);
</script>
</body>
</html>
